<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Luvia Creations</title>
    <script>
      // Product pages are prerendered on each deploy, so a product published
      // since then has no static page yet. Bootstrap its full product view.
      (function () {
        var match = window.location.pathname.match(/^\/p\/([^/]+)\/?$/);
        var params = new URLSearchParams(window.location.search);
        if (match) params.set('productPage', decodeURIComponent(match[1]));
        var target = match ? '/?' + params.toString() : '/';
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p><a href="/">Continue to the Luvia Creations catalogue</a></p>
  </body>
</html>

name: Process product making videos

on:
  workflow_dispatch:
    inputs:
      storage_check:
        description: Verify private/public R2 object permissions only; never process jobs or change CORS
        type: boolean
        required: false
        default: false
      processor_check:
        description: Private synthetic FFmpeg/storage smoke only; no queue or product changes
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: product-making-video-processor
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Check for bounded queued work before checkout/install
        if: inputs.storage_check != true && inputs.processor_check != true
        id: queue
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const base = process.env.SUPABASE_URL;
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          if (!base || !key) throw new Error('Video processor Supabase secrets are missing.');
          const url = new URL('/rest/v1/product_video_jobs', base);
          url.searchParams.set('select', 'id');
          url.searchParams.set('status', 'in.(queued,processing,discarding)');
          url.searchParams.set('limit', '1');
          const response = await fetch(url, {
            headers: { apikey: key, Authorization: `Bearer ${key}` },
            signal: AbortSignal.timeout(20000),
          });
          if (!response.ok) throw new Error(`Video queue check failed (HTTP ${response.status}).`);
          const rows = await response.json();
          if (!Array.isArray(rows)) throw new Error('Invalid video queue response.');
          appendFileSync(process.env.GITHUB_OUTPUT, `has_work=${rows.length > 0}\n`);
          console.log(rows.length ? 'Video work found.' : 'No pending video work; skipping setup and processing.');
          JS
      - uses: actions/checkout@v4
        if: inputs.storage_check == true || inputs.processor_check == true || steps.queue.outputs.has_work == 'true'
      - uses: actions/setup-node@v4
        if: inputs.storage_check == true || inputs.processor_check == true || steps.queue.outputs.has_work == 'true'
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
        if: inputs.storage_check == true || inputs.processor_check == true || steps.queue.outputs.has_work == 'true'
      - name: Verify bounded R2 object permissions
        if: inputs.storage_check == true
        timeout-minutes: 5
        run: node scripts/verify-r2-video-storage.mjs
        env:
          R2_OBJECT_CHECK_ONLY: 'true'
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ORIGINALS_BUCKET: ${{ secrets.R2_ORIGINALS_BUCKET }}
      - name: Ensure FFmpeg is installed for queued jobs
        if: inputs.processor_check == true || steps.queue.outputs.has_work == 'true'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Verify FFmpeg availability
        if: inputs.processor_check == true || steps.queue.outputs.has_work == 'true'
        run: ffmpeg -version && ffprobe -version && test -f public/images/luvia-logo-480.webp
      - name: Verify private synthetic processor pipeline
        if: inputs.processor_check == true
        timeout-minutes: 8
        run: node scripts/verify-video-processor.mjs
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ORIGINALS_BUCKET: ${{ secrets.R2_ORIGINALS_BUCKET }}
      - name: Process bounded video queue
        if: steps.queue.outputs.has_work == 'true'
        run: node scripts/process-product-videos.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ORIGINALS_BUCKET: ${{ secrets.R2_ORIGINALS_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

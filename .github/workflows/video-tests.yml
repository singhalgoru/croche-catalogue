name: Video processing tests

on:
  push:
    branches: [main]
    paths:
      - 'scripts/*video*'
      - 'supabase/functions/_shared/productVideo*'
      - 'supabase/functions/product-videos/**'
      - 'public/images/luvia-logo-480.webp'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - '.github/workflows/video-tests.yml'
  pull_request:
    paths:
      - 'scripts/*video*'
      - 'supabase/functions/_shared/productVideo*'
      - 'supabase/functions/product-videos/**'
      - 'public/images/luvia-logo-480.webp'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - '.github/workflows/video-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  video-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install FFmpeg
        timeout-minutes: 10
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Test real video processing
        run: npx vitest run scripts/process-product-videos.test.ts

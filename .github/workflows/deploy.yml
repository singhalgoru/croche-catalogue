name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      delay_seconds:
        description: Seconds to wait before building (catalogue-change triggers use this to batch edits)
        required: false
        default: '0'
  # Rebuild prerendered product pages and sitemap from published Supabase data.
  # Catalogue changes also trigger a rebuild from Supabase (see the
  # request_site_rebuild migration); this daily run is a safety net.
  # Offset from the hour to avoid GitHub Actions' busiest scheduling window.
  schedule:
    - cron: '23 1 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # A newer catalogue change cancels this run while it waits, so a burst
      # of admin edits produces one build of the final data.
      - name: Wait for further catalogue edits
        if: github.event_name == 'workflow_dispatch' && inputs.delay_seconds != '0'
        env:
          DELAY_SECONDS: ${{ inputs.delay_seconds }}
        run: |
          case "$DELAY_SECONDS" in ''|*[!0-9]*) exit 0 ;; esac
          sleep "$(( DELAY_SECONDS > 300 ? 300 : DELAY_SECONDS ))"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_META_PIXEL_ID: ${{ vars.VITE_META_PIXEL_ID }}
          VITE_WHATSAPP_NUMBER: ${{ vars.VITE_WHATSAPP_NUMBER }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_CSP_EXTRA_CONNECT_SRC: ""

      - name: Generate Merchant Center feed and clean images
        run: node scripts/merchant-feed.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_WHATSAPP_NUMBER: ${{ vars.VITE_WHATSAPP_NUMBER }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ORIGINALS_BUCKET: ${{ secrets.R2_ORIGINALS_BUCKET }}

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

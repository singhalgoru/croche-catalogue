name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      delay_seconds:
        description: Seconds to wait before building (catalogue-change triggers use this to batch edits)
        required: false
        default: '0'
  # Rebuild prerendered product pages and sitemap from published Supabase data.
  # Catalogue changes also trigger a rebuild from Supabase (see the
  # request_site_rebuild migration); this daily run is a safety net.
  # Offset from the hour to avoid GitHub Actions' busiest scheduling window.
  schedule:
    - cron: '23 1 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Blocks every deployment unless lint, type checks, unit tests and the
  # release-path browser suite pass. Catalogue-change and scheduled rebuilds
  # reuse an earlier pass for the same commit so admin edits are not slowed
  # down.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for an earlier pass of this commit
        id: verified
        uses: actions/cache/restore@v4
        with:
          path: .verified
          key: verified-${{ github.sha }}
          lookup-only: true

      - name: Set up Node
        if: steps.verified.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.verified.outputs.cache-hit != 'true'
        run: npm ci

      - name: Lint
        if: steps.verified.outputs.cache-hit != 'true'
        run: npm run lint

      - name: Type check
        if: steps.verified.outputs.cache-hit != 'true'
        run: npx tsc -b

      - name: Install FFmpeg for video processing tests
        if: steps.verified.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Unit tests
        if: steps.verified.outputs.cache-hit != 'true'
        run: npm test
        env:
          VITE_SUPABASE_URL: http://supabase.test
          VITE_SUPABASE_ANON_KEY: test-anon-key
          VITE_GA_MEASUREMENT_ID: G-TEST123456
          VITE_META_PIXEL_ID: TEST-PIXEL-123
          VITE_CSP_EXTRA_CONNECT_SRC: http://supabase.test
          VITE_TURNSTILE_SITE_KEY: ""
          VITE_ENABLE_RAZORPAY_TEST_CHECKOUT: "true"

      - name: Install Playwright browser
        if: steps.verified.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Release browser tests (desktop and mobile)
        if: steps.verified.outputs.cache-hit != 'true'
        run: npm run test:e2e

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

      - name: Record the pass for this commit
        if: steps.verified.outputs.cache-hit != 'true'
        run: mkdir -p .verified && echo "${{ github.sha }}" > .verified/sha

      - name: Save the pass marker
        if: steps.verified.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .verified
          key: verified-${{ github.sha }}

  build:
    runs-on: ubuntu-latest
    outputs:
      entry_asset: ${{ steps.entry.outputs.asset }}
    steps:
      # A newer catalogue change cancels this run while it waits, so a burst
      # of admin edits produces one build of the final data.
      - name: Wait for further catalogue edits
        if: github.event_name == 'workflow_dispatch' && inputs.delay_seconds != '0'
        env:
          DELAY_SECONDS: ${{ inputs.delay_seconds }}
        run: |
          case "$DELAY_SECONDS" in ''|*[!0-9]*) exit 0 ;; esac
          sleep "$(( DELAY_SECONDS > 300 ? 300 : DELAY_SECONDS ))"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_META_PIXEL_ID: ${{ vars.VITE_META_PIXEL_ID }}
          VITE_WHATSAPP_NUMBER: ${{ vars.VITE_WHATSAPP_NUMBER }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_CSP_EXTRA_CONNECT_SRC: ""
          VITE_ENABLE_RAZORPAY_TEST_CHECKOUT: ${{ vars.VITE_ENABLE_RAZORPAY_TEST_CHECKOUT }}

      - name: Record the entry script name
        id: entry
        run: |
          asset="$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -n 1)"
          test -n "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Generate Merchant Center feed and clean images
        run: node scripts/merchant-feed.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_WHATSAPP_NUMBER: ${{ vars.VITE_WHATSAPP_NUMBER }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ORIGINALS_BUCKET: ${{ secrets.R2_ORIGINALS_BUCKET }}

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: [verify, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Confirm this exact build is live without another dependency/browser install.
  # The full live browser suite remains available through npm run test:smoke.
  live-check:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify the live homepage and entry script
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          ENTRY_ASSET: ${{ needs.build.outputs.entry_asset }}
        run: |
          for attempt in $(seq 1 60); do
            if homepage="$(curl -fsS --connect-timeout 10 --max-time 20 "${PAGE_URL}?deploy-check=${GITHUB_RUN_ID}-${attempt}")" \
              && grep -Fq "$ENTRY_ASSET" <<< "$homepage" \
              && curl -fsS --connect-timeout 10 --max-time 20 "${PAGE_URL%/}/${ENTRY_ASSET}" -o /dev/null; then
              echo "Live site serves $ENTRY_ASSET"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The live site did not serve an accessible $ENTRY_ASSET within the retry window"
          exit 1

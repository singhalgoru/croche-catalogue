name: Backup Supabase Database and R2 Images

# Daily encrypted backup of the Supabase Postgres database, pushed to a
# separate private repo (singhalgoru/croche-catalogue-backups). Only the
# last 2 database backups are kept — each run rotates backup-latest -> backup-previous
# and overwrites backup-latest with the new dump. Product images from R2 are
# mirrored into r2-images/; only new images are downloaded, and images deleted
# in admin stay in the backup. Private unwatermarked originals are preserved
# separately in image-originals/.
on:
  schedule:
    - cron: '0 21 * * *' # 21:00 UTC = ~02:30 IST, daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install PostgreSQL 17 client
        # Supabase runs Postgres 17; pg_dump requires a client version >= the
        # server version, and Ubuntu's default postgresql-client package (v16)
        # is too old. Install the matching client from the PGDG apt repo.
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common gnupg
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges --clean --if-exists -f backup.sql
          gzip backup.sql

      - name: Encrypt backup
        env:
          BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          gpg --batch --yes --passphrase "$BACKUP_GPG_PASSPHRASE" --symmetric --cipher-algo AES256 \
            -o backup.sql.gz.gpg backup.sql.gz
          rm backup.sql.gz

      - name: Clone private backup repo
        env:
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: git clone "https://x-access-token:${BACKUP_REPO_TOKEN}@github.com/singhalgoru/croche-catalogue-backups.git" backup-repo

      # An image failure must not stop the database backup from being pushed;
      # the last step fails the run afterwards so it is still noticed.
      - name: Mirror R2 images
        id: images
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/backup-r2-images.mjs backup-repo/r2-images

      - name: Back up private image originals
        id: originals
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_ORIGINALS_BUCKET }}
        run: |
          mkdir -p backup-repo/image-originals
          node scripts/backup-r2-images.mjs backup-repo/image-originals backup-repo/image-originals/manifest.json

      - name: Push rotated backup to private backup repo
        run: |
          set -euo pipefail
          cd backup-repo

          if [ -f backup-latest.sql.gz.gpg ]; then
            mv -f backup-latest.sql.gz.gpg backup-previous.sql.gz.gpg
          fi
          mv -f ../backup.sql.gz.gpg backup-latest.sql.gz.gpg
          date -u +%Y-%m-%dT%H:%M:%SZ > last-backup-timestamp.txt

          git config user.name "croche-catalogue-backup-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Daily backup $(date -u +%Y-%m-%d)" || echo "No changes to commit"
          git push

      - name: Report image backup failure
        if: steps.images.outcome == 'failure' || steps.originals.outcome == 'failure'
        run: |
          echo "::error::Image backup failed (R2 images or private originals); the database backup was still pushed."
          exit 1
